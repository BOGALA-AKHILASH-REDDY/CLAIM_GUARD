services:
  - type: web
    name: claimguard
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        value: sqlite:///./claimguard.db
      - key: SECRET_KEY
        generateValue: true
